name: Daten aktualisieren

on:
  schedule:
    # alle 3 Stunden; sonntags (Haupt-Spieltag) zusätzlich stündlich ab 13 Uhr
    - cron: "23 */3 * * *"
    - cron: "41 12-21 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scraper/**"

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Ligen einlesen
        run: python scraper/scrape.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- docs/data; then
            echo "Keine neuen Daten."
            exit 0
          fi
          git config user.name "orakel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Daten aktualisiert"
          git push
