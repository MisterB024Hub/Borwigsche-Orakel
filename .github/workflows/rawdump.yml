name: rawdump
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Leerzeichen-getrennte URLs"
        required: true
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            curl -sSL -A "Mozilla/5.0 BorwigscheOrakel" --max-time 60 -o "p$i.html" "$u" || echo "FAIL $u" > "p$i.html"
            echo "p$i.html $u" >> index.txt
          done
          ls -la
      - name: Push to rawdump branch
        run: |
          cd out
          git init -q -b rawdump
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "raw dump"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rawdump
